# Paths are relative to --sample-root (default: <output-root>/samples).
# Default small runs prepare selected hits from these source catalogues.
# Explicit --sample-root uses the prepared paths below. No synthetic fallback.
version: 1
datasets:
  mc-neutrino:
    sources:
      seed: feature-dev-v1
      files_per_group: 4
      events_per_file: 100
      events_per_group: 100
      catalogues:
        - /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/manifests/mc_neutrino.csv
    description: Neutrino MC; preserve CC/NC and electron/muon flavour labels.
    normalization: auto
    required_groups: [CC_nue, CC_numu, NC_nue, NC_numu]
    samples:
      small: mc-neutrino/small-v1.jsonl
      full: mc-neutrino/full-v1.jsonl
  testbeam:
    sources:
      seed: feature-dev-v1
      files_per_group: 2
      events_per_file: 100
      events_per_group: 25
      catalogues:
        - /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/manifests/testbeam_mc_2024.csv
        - catalogues/testbeam_data_2024_run100916.csv
        - /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/testbeam_2023_h8_v2/testbeam_data_2023_h8.csv
    description: Testbeam data and MC; preserve particle, energy and geometry labels.
    normalization: auto
    samples:
      small: testbeam/small-v1.jsonl
      full: testbeam/full-v1.jsonl
  real-data:
    sources:
      seed: feature-dev-v1
      files_per_group: 2
      events_per_file: 100
      events_per_group: 100
      catalogues:
        - /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/real_data_distributions/unified_real_data_distributions_v1/source_manifests/real_data_2024_no_veto.csv
        - /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/real_data_distributions/unified_real_data_distributions_v1/source_manifests/real_data_2024_veto_10pct.csv
    description: Collision data with separate no-veto and sampled veto groups.
    normalization: auto
    required_groups: [real_data_2024_no_veto, real_data_2024_veto_10pct]
    samples:
      small: real-data/small-v1.jsonl
      full: real-data/full-v1.jsonl
  mc-muon:
    sources:
      seed: feature-dev-v1
      files_per_group: 2
      events_per_file: 100
      events_per_group: 100
      catalogues:
        - /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/manifests/mc_muon_up.csv
    description: Optional upward-going muon MC; excluded from dataset all.
    normalization: auto
    samples:
      small: mc-muon/small-v1.jsonl
      full: mc-muon/full-v1.jsonl
