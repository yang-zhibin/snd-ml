[task]
# Use "start" for a new worktree or "resume" for an existing one.
action = start

# Lowercase letters, numbers, hyphens, underscores, and periods are allowed.
name = replace-with-task-name

# New tasks branch from this committed Git ref.
base_ref = develop
worktree_root = /afs/cern.ch/user/z/zhibin/worktrees
open_vscode = yes

goal =
    Replace this text with the observable result the task must produce.

acceptance_criteria =
    Replace this line with a verifiable result.
    Add another criterion on a new indented line when needed.

scope =
    List relevant files, directories, or subsystems.
    Keep the task focused on one outcome.

constraints =
    List important invariants and compatibility requirements.
    State anything that must remain unchanged.

next_action =
    Write the first concrete action for a new task, or the next verified action
    for a resumed task.
