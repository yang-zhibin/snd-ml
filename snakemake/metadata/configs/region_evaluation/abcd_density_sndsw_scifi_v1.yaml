version: density_sndsw_scifi_v1
description: >
  Frozen initial density_sndsw_scifi binning for Region V1 ABCD raw-count
  histograms. The 500-unit bin width follows the Region V2 veto-inspection
  workflow. Histograms contain unweighted data counts for Poisson inference.

catalogue:
  partition_version: partition_v1
  region_version: region_v1
  particle_group: real_data

input:
  tree_name: sndData
  feature: density_sndsw_scifi

histogram:
  name: h_density_sndsw_scifi_raw
  bins: 80
  min: 0.0
  max: 40000.0
  bin_width: 500.0
  weight: unit
  underflow: preserve
  overflow: fold_last
  sumw2: true

output:
  directory: /afs/cern.ch/work/z/zhibin/snd-ml-outputs/abcd/legacy-unified-shower-features/partition_v1_region_v1/density_sndsw_scifi_v1
  histogram_directory: hists
  summary_directory: summaries

