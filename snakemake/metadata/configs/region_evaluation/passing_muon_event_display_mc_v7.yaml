version: passing_muon_event_display_mc_v7
description: >-
  Deterministic SNDSW event displays for the pooled V7 upward-muon MC sample,
  using the same loose detector-coverage categories as the Run-8329 display.

study_config: snakemake/metadata/configs/region_evaluation/passing_muon_binary_region_study_v7.yaml
reference_histogram: /eos/experiment/sndlhc/users/zhibin/snd-ml/evaluation_region_partitions/passing_muon_run8329_detector_selection_study_v7/histograms/detector_selection_combined.root

samples: [mc_muon_up]

input:
  tree_name: sndData
  mc_metadata: snakemake/metadata/updated/MC_muon_up_metadata.csv
  event_tree_candidates: [cbmsim, rawConv]

selection:
  working_point: coverage_loose
  failure_veto_categories:
    veto_lt3:
      label: "loose-selection failure, 0 <= veto count < 3"
      expression: "count_veto >= 0 && count_veto < 3"
    veto_eq3:
      label: "loose-selection failure, veto count = 3"
      expression: "count_veto == 3"
    veto_gt3:
      label: "loose-selection failure, veto count > 3"
      expression: "count_veto > 3"
  additional_failure_criteria:
    scifi_hit_count_gt100:
      label: "SciFi hit count > 100"
      expression: "count_scifi > 100"
    scifi_density_gt100:
      label: "SciFi density > 100"
      expression: "density_sndsw_scifi > 100"
    scifi_density_gt500:
      label: "SciFi density > 500"
      expression: "density_sndsw_scifi > 500"
    scifi_density_gt1000:
      label: "SciFi density > 1000"
      expression: "density_sndsw_scifi > 1000"
    scifi_density_gt5000:
      label: "SciFi density > 5000"
      expression: "density_sndsw_scifi > 5000"

sampling:
  events_per_category: 25
  reserve_factor: 2
  mode: round_robin_sources
  minimum_sources: 10

annotations:
  max_lines: 10

display:
  output_mode: vector_pdf
  canvas_width: 1600
  canvas_height: 1000
  sndsw_display_script: ""

output:
  directory: /afs/cern.ch/work/z/zhibin/snd-ml-outputs/region-evaluation/legacy-unified-shower-features/passing_muon_run8329_detector_selection_study_v7/event_display_mc_loose_coverage
  selected_manifest: selected_events.csv
  category_counts: category_counts.csv
  rendered_manifest: rendered_events.csv
