version: density_sndsw_scifi_analysis_report_v1
table_version: density_sndsw_scifi_analysis_table_v1
title: Region V1 ABCD Step 3 Density Analysis Tables
description: >
  Human-readable LaTeX/PDF rendering of the validated Step 3 analysis table.
  It reports materialized data and MC inputs only and contains no ABCD
  prediction, kappa, closure result, merged binning, or likelihood fit.

normalized_plots:
  mode: unit_area_per_distribution
  regular_bins: 80
  include_underflow: false
  overflow_policy: folded_into_last_regular_bin
  log_y: true
  dpi: 180
  description: >
    In each region, independently normalize the regular-bin Data, CC_nue,
    summed neutrino-background, and total standard-neutrino distributions to
    unit area. These are shape-only comparisons; absolute counts and
    luminosity-normalized MC yields remain in the tables.

output:
  directory: evaluation_region_partitions/abcd/partition_v1_region_v1/density_sndsw_scifi_v1/tables
  tex: analysis_table_v1.tex
  pdf: analysis_table_v1.pdf
  normalized_plot_directory: normalized_distribution_plots_v1
