version: abcd_input_audit_v1
description: >
  Frozen Region V1 real-data catalogue expectations used before constructing
  ABCD estimates. Event counts are inclusive metadata n_events totals; they
  are not histogram integrals.

catalogue:
  partition_version: partition_v1
  region_version: region_v1
  particle_group: real_data

validation:
  exposure_absolute_tolerance: 1.0e-9
  require_feature_available: true
  require_unique_partition_ids: true

output:
  directory: evaluation_region_partitions/abcd/partition_v1_region_v1/abcd_input_audit_v1
  csv: input_audit.csv
  report: input_audit.md

