version: hist_features_v1
description: >
  Histogram feature definitions for the region-partition evaluation workflow.
  These settings are based on the old nueAnalysis evaluation histogram ranges,
  with room for newer feature branches from the region-partition feature files.

defaults:
  fold_underflow: false
  fold_overflow: false
  feature_cut: ""

features:
  density_scifi:
    expression: density_scifi
    x_min: 1000
    x_max: 100000
    bin_width: 5000
    axis_title: Sum of SciFi Density Weight
    logy: true

  density_scifi1:
    expression: density_scifi1
    x_min: 0
    x_max: 40000
    bin_width: 1000
    axis_title: Plane 1 Sum of SciFi Density Weight
    logy: true

  density_scifi2:
    expression: density_scifi2
    x_min: 0
    x_max: 40000
    bin_width: 1000
    axis_title: Plane 2 Sum of SciFi Density Weight
