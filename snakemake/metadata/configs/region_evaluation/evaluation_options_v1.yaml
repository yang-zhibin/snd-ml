fiducial_study:
  denominator:
    name: scifi_region_preselection
    expression: count_scifi > 35
  definitions:
    current_avg_scifi_fiducial:
      expression: >
        (count_scifi1 <= 2 || (avg_scifi1_x > -44 && avg_scifi1_x < -10 && avg_scifi1_y > 18 && avg_scifi1_y < 52)) &&
        (count_scifi2 <= 2 || (avg_scifi2_x > -44 && avg_scifi2_x < -10 && avg_scifi2_y > 18 && avg_scifi2_y < 52)) &&
        (count_scifi3 <= 2 || (avg_scifi3_x > -42 && avg_scifi3_x < -12 && avg_scifi3_y > 20 && avg_scifi3_y < 50)) &&
        (count_scifi4 <= 2 || (avg_scifi4_x > -42 && avg_scifi4_x < -12 && avg_scifi4_y > 20 && avg_scifi4_y < 50)) &&
        (count_scifi5 <= 2 || (avg_scifi5_x > -42 && avg_scifi5_x < -12 && avg_scifi5_y > 20 && avg_scifi5_y < 50))
    qdcAvg_scifi_fiducial:
      expression: >
        (count_scifi1 <= 2 || (qdcAvg_scifi1_x > -44 && qdcAvg_scifi1_x < -10 && qdcAvg_scifi1_y > 18 && qdcAvg_scifi1_y < 52)) &&
        (count_scifi2 <= 2 || (qdcAvg_scifi2_x > -44 && qdcAvg_scifi2_x < -10 && qdcAvg_scifi2_y > 18 && qdcAvg_scifi2_y < 52)) &&
        (count_scifi3 <= 2 || (qdcAvg_scifi3_x > -42 && qdcAvg_scifi3_x < -12 && qdcAvg_scifi3_y > 20 && qdcAvg_scifi3_y < 50)) &&
        (count_scifi4 <= 2 || (qdcAvg_scifi4_x > -42 && qdcAvg_scifi4_x < -12 && qdcAvg_scifi4_y > 20 && qdcAvg_scifi4_y < 50)) &&
        (count_scifi5 <= 2 || (qdcAvg_scifi5_x > -42 && qdcAvg_scifi5_x < -12 && qdcAvg_scifi5_y > 20 && qdcAvg_scifi5_y < 50))
    sndsw_scifi_fiducial:
      expression: AvgSFChan == 1

feature_pair_comparisons:
  weighted_avg_vs_avg:
    enabled: true
    description: >
      Overlay QDC-weighted average position features with the matching
      unweighted average position features for each configured region and
      particle group. These pages are appended to the weighted-feature plot
      PDFs.
    pairs:
      - left: avg_scifi_x
        right: qdcAvg_scifi_x
        left_label: Average SciFi X
        right_label: QDC-weighted SciFi X
      - left: avg_scifi_y
        right: qdcAvg_scifi_y
        left_label: Average SciFi Y
        right_label: QDC-weighted SciFi Y
      - left: avg_scifi1_x
        right: qdcAvg_scifi1_x
        left_label: Plane 1 average SciFi X
        right_label: Plane 1 QDC-weighted SciFi X
      - left: avg_scifi2_x
        right: qdcAvg_scifi2_x
        left_label: Plane 2 average SciFi X
        right_label: Plane 2 QDC-weighted SciFi X
      - left: avg_scifi3_x
        right: qdcAvg_scifi3_x
        left_label: Plane 3 average SciFi X
        right_label: Plane 3 QDC-weighted SciFi X
      - left: avg_scifi4_x
        right: qdcAvg_scifi4_x
        left_label: Plane 4 average SciFi X
        right_label: Plane 4 QDC-weighted SciFi X
      - left: avg_scifi5_x
        right: qdcAvg_scifi5_x
        left_label: Plane 5 average SciFi X
        right_label: Plane 5 QDC-weighted SciFi X
      - left: avg_scifi1_y
        right: qdcAvg_scifi1_y
        left_label: Plane 1 average SciFi Y
        right_label: Plane 1 QDC-weighted SciFi Y
      - left: avg_scifi2_y
        right: qdcAvg_scifi2_y
        left_label: Plane 2 average SciFi Y
        right_label: Plane 2 QDC-weighted SciFi Y
      - left: avg_scifi3_y
        right: qdcAvg_scifi3_y
        left_label: Plane 3 average SciFi Y
        right_label: Plane 3 QDC-weighted SciFi Y
      - left: avg_scifi4_y
        right: qdcAvg_scifi4_y
        left_label: Plane 4 average SciFi Y
        right_label: Plane 4 QDC-weighted SciFi Y
      - left: avg_scifi5_y
        right: qdcAvg_scifi5_y
        left_label: Plane 5 average SciFi Y
        right_label: Plane 5 QDC-weighted SciFi Y

overall_particle_overlay:
  enabled: true
  split_eventbuilder: true
  description: >
    Overlay particle groups after combining all configured regions. Real data
    is split into no-veto and has-veto groups instead of one combined data
    curve.
  data_region_groups:
    real_data_no_veto:
      label: "Real data no veto"
      regions:
        - signal_no_veto_has_us_fiducial_inside
        - sideband_no_veto_no_us_fiducial_inside
        - sideband_no_veto_has_us_fiducial_outside
        - sideband_no_veto_no_us_fiducial_outside
    real_data_has_veto:
      label: "Real data has veto"
      regions:
        - sideband_has_veto_has_us_fiducial_inside
        - sideband_has_veto_no_us_fiducial_inside
        - sideband_has_veto_has_us_fiducial_outside
        - sideband_has_veto_no_us_fiducial_outside
  no_veto_particle_overlay:
    enabled: true
    label: "Overall no-veto particle overlay"
    regions:
      - signal_no_veto_has_us_fiducial_inside
      - sideband_no_veto_no_us_fiducial_inside
      - sideband_no_veto_has_us_fiducial_outside
      - sideband_no_veto_no_us_fiducial_outside
    data_label: "Real data no veto"

eventbuilder_veto_timing:
  regions:
    - sideband_has_veto_has_us_fiducial_inside
    - sideband_has_veto_no_us_fiducial_inside
    - sideband_has_veto_has_us_fiducial_outside
    - sideband_has_veto_no_us_fiducial_outside
  pairs:
    - normal: CC_nue
      eventbuilder: CC_nue_EventBuilder
    - normal: CC_numu
      eventbuilder: CC_numu_EventBuilder
    - normal: NC_nue
      eventbuilder: NC_nue_EventBuilder
    - normal: NC_numu
      eventbuilder: NC_numu_EventBuilder
  features:
    - vetoHitTime_earlist_ns
    - vetoHitTime_latest_ns
    - vetoHitTime_earlist_veto1_ns
    - vetoHitTime_latest_veto1_ns
    - vetoHitTime_earlist_veto2_ns
    - vetoHitTime_latest_veto2_ns
    - vetoHitTime_earlist_veto3_ns
    - vetoHitTime_latest_veto3_ns
