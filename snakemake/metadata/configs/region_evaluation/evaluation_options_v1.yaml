version: evaluation_options_v1
description: >
  Cut, normalization, and comparison options for the region-partition
  evaluation workflow.

metadata:
  partition_csv: snakemake/metadata/region_partitions/partition_v1_region_v1.csv
  tree_name: sndData
  friend_tree_name: cutFlowSummary

normalization:
  default: signal_data_lumi
  reference:
    region: signal_no_veto_has_us_fiducial_inside
    particle_group: real_data
  fail_on_missing_reference: true

cuts:
  definitions:
    stable_beams:
      expression: StableBeams == 1
      applies_to: real_data_only

    ip1_bunch_crossing:
      expression: IP1 == 1
      applies_to: real_data_only

    pre_evt_clock_cycle_100:
      expression: EventDeltat_1_100 == 1
      applies_to: real_data_only

    avg_scifi_fiducial:
      expression: AvgSFChan == 1
      applies_to: all

    us_bars_veto_top:
      expression: USBarsVeto_0_2_000000_1_2_000000 == 1
      applies_to: all

    us_bars_veto_bottom:
      expression: USBarsVeto_0_8_000000_1_8_000000 == 1
      applies_to: all

    no_veto_hit:
      expression: NoVetoHits == 1
      applies_to: all

    consecutive_scifi_hits:
      expression: At_least_two_consecutive_SciFi_planes == 1
      applies_to: all

    scifi_continuity:
      expression: SciFiContinuity == 1
      applies_to: all

    us_plane_hit_0_1:
      expression: USPlanesHit == 1
      applies_to: all

    scifi_hit_35:
      expression: SciFiMinHits == 1
      applies_to: all

    us_qdc_700mc_600data:
      expression: USQDC == 1
      applies_to: all

    no_hit_last_ds:
      expression: DSVetoCut == 1
      applies_to: all

  base_cut_options:
    none: []

    old_default:
      - stable_beams
      - ip1_bunch_crossing
      - pre_evt_clock_cycle_100
      - avg_scifi_fiducial
      - no_veto_hit
      - consecutive_scifi_hits
      - scifi_continuity

    old_default_with_us:
      - stable_beams
      - ip1_bunch_crossing
      - pre_evt_clock_cycle_100
      - avg_scifi_fiducial
      - no_veto_hit
      - consecutive_scifi_hits
      - scifi_continuity
      - us_plane_hit_0_1

    old_full:
      - stable_beams
      - ip1_bunch_crossing
      - pre_evt_clock_cycle_100
      - avg_scifi_fiducial
      - us_bars_veto_top
      - us_bars_veto_bottom
      - no_veto_hit
      - consecutive_scifi_hits
      - scifi_continuity
      - us_plane_hit_0_1
      - scifi_hit_35
      - us_qdc_700mc_600data
      - no_hit_last_ds

    region_basic:
      - consecutive_scifi_hits
      - scifi_continuity

  extra_cut_options:
    none: ""
    density_sndsw_scifi_gt_100: density_sndsw_scifi > 100
    density_sndsw_scifi_gt_1000: density_sndsw_scifi > 1000
    density_sndsw_scifi_gt_2000: density_sndsw_scifi > 2000
    density_sndsw_scifi_1000_6000: density_sndsw_scifi > 1000 && density_sndsw_scifi < 6000
    density_sndsw_scifi_2000_5000: density_sndsw_scifi > 2000 && density_sndsw_scifi < 5000
    count_scifi_gt_200: count_scifi > 200
    count_scifi_gt_300: count_scifi > 300
    count_us_gt_0: count_us > 0
    count_us_eq_0: count_us == 0
    count_veto_eq_0: count_veto == 0
    count_veto_gt_0: count_veto > 0

comparisons:
  modes:
    particles_in_region:
      description: Compare particle groups inside one fixed region.
      fixed_axis: region
      compare_axis: particle_group

    regions_for_particle:
      description: Compare regions for one fixed particle group.
      fixed_axis: particle_group
      compare_axis: region

  regions:
    - signal_no_veto_has_us_fiducial_inside
    - sideband_no_veto_no_us_fiducial_inside
    - sideband_no_veto_has_us_fiducial_outside
    - sideband_no_veto_no_us_fiducial_outside
    - sideband_has_veto_has_us_fiducial_inside
    - sideband_has_veto_no_us_fiducial_inside
    - sideband_has_veto_has_us_fiducial_outside
    - sideband_has_veto_no_us_fiducial_outside

  particle_groups:
    - real_data
    - CC_nue
    - CC_numu
    - NC_nue
    - NC_numu
    - CC_nue_EventBuilder
    - CC_numu_EventBuilder
    - NC_nue_EventBuilder
    - NC_numu_EventBuilder
    - muonDIS
    - muon

plot:
  default_style: overlay
  draw_ratio_panel: false
  draw_option: E1
  region_preselection_label: "Region preselection: SciFi count > 35"
  fiducial_overlays:
    enabled: true
    original_sndsw:
      label: "Original AvgSFChan converted"
      x: [-40.999, -15.543]
      y: [21.954, 48.697]
      color: "#1f77b4"
    separated_s12:
      label: "Separated planes 1-2"
      x: [-44.0, -10.0]
      y: [18.0, 52.0]
      color: "#d62728"
    separated_s345:
      label: "Separated planes 3-5"
      x: [-42.0, -12.0]
      y: [20.0, 50.0]
      color: "#2ca02c"
  base_cut_labels:
    none: "none"
    old_default: "old default"
    old_default_with_us: "old default + US"
    old_full: "old full"
    region_basic: "SciFi topology"
  extra_cut_labels:
    none: "none"
    density_sndsw_scifi_gt_100: "density_sndsw_scifi > 100"
    density_sndsw_scifi_gt_1000: "density_sndsw_scifi > 1000"
    density_sndsw_scifi_gt_2000: "density_sndsw_scifi > 2000"
    density_sndsw_scifi_1000_6000: "1000 < density_sndsw_scifi < 6000"
    density_sndsw_scifi_2000_5000: "2000 < density_sndsw_scifi < 5000"
    count_scifi_gt_200: "count_scifi > 200"
    count_scifi_gt_300: "count_scifi > 300"
    count_us_gt_0: "count_us > 0"
    count_us_eq_0: "count_us == 0"
    count_veto_eq_0: "count_veto == 0"
    count_veto_gt_0: "count_veto > 0"
  particle_labels:
    real_data: "Real data"
    CC_nue: "MC CC nue"
    CC_numu: "MC CC numu"
    NC_nue: "MC NC nue"
    NC_numu: "MC NC numu"
    CC_nue_EventBuilder: "EventBuilder CC nue"
    CC_numu_EventBuilder: "EventBuilder CC numu"
    NC_nue_EventBuilder: "EventBuilder NC nue"
    NC_numu_EventBuilder: "EventBuilder NC numu"
    muonDIS: "MC muon DIS"
    muon: "MC muon"
  particle_styles:
    real_data: {color: black, marker: 20}
    CC_nue: {color: blue, marker: 21}
    CC_numu: {color: red, marker: 22}
    NC_nue: {color: green, marker: 23}
    NC_numu: {color: magenta, marker: 33}
    CC_nue_EventBuilder: {color: blue_light, marker: 25}
    CC_numu_EventBuilder: {color: red_light, marker: 26}
    NC_nue_EventBuilder: {color: green_light, marker: 32}
    NC_numu_EventBuilder: {color: magenta, marker: 34}
    muonDIS: {color: orange, marker: 24}
    muon: {color: cyan, marker: 25}
  region_labels:
    signal_no_veto_has_us_fiducial_inside: "Signal region: no veto, has US, inside"
    sideband_no_veto_no_us_fiducial_inside: "SB1 Sideband: no veto, no US, inside"
    sideband_no_veto_has_us_fiducial_outside: "SB2 Sideband: no veto, US, outside"
    sideband_no_veto_no_us_fiducial_outside: "SB3 Sideband: no veto, no US, outside"
    sideband_has_veto_has_us_fiducial_inside: "SB4 Sideband: veto, US, inside"
    sideband_has_veto_no_us_fiducial_inside: "SB5 Sideband: veto, no US, inside"
    sideband_has_veto_has_us_fiducial_outside: "SB6 Sideband: veto, US, outside"
    sideband_has_veto_no_us_fiducial_outside: "SB7 Sideband: veto, no US, outside"
  region_definitions:
    signal_no_veto_has_us_fiducial_inside: "no veto, US activity, SciFi fiducial inside"
    sideband_no_veto_no_us_fiducial_inside: "SB1: no veto, no US activity, SciFi fiducial inside"
    sideband_no_veto_has_us_fiducial_outside: "SB2: no veto, US activity, SciFi fiducial outside"
    sideband_no_veto_no_us_fiducial_outside: "SB3: no veto, no US activity, SciFi fiducial outside"
    sideband_has_veto_has_us_fiducial_inside: "SB4: veto activity, US activity, SciFi fiducial inside"
    sideband_has_veto_no_us_fiducial_inside: "SB5: veto activity, no US activity, SciFi fiducial inside"
    sideband_has_veto_has_us_fiducial_outside: "SB6: veto activity, US activity, SciFi fiducial outside"
    sideband_has_veto_no_us_fiducial_outside: "SB7: veto activity, no US activity, SciFi fiducial outside"
  region_styles:
    signal_no_veto_has_us_fiducial_inside: {color: blue_dark, marker: 20}
    sideband_no_veto_has_us_fiducial_outside: {color: blue_light, marker: 24}
    sideband_no_veto_no_us_fiducial_inside: {color: green_dark, marker: 21}
    sideband_no_veto_no_us_fiducial_outside: {color: green_light, marker: 25}
    sideband_has_veto_has_us_fiducial_inside: {color: red_dark, marker: 22}
    sideband_has_veto_has_us_fiducial_outside: {color: red_light, marker: 26}
    sideband_has_veto_no_us_fiducial_inside: {color: orange_dark, marker: 23}
    sideband_has_veto_no_us_fiducial_outside: {color: orange_light, marker: 32}
  summary_csv: true
  pdf: true

outputs:
  root_dir: evaluation_region_partitions
  hist_dir: /eos/experiment/sndlhc/users/zhibin/snd-ml/evaluation_region_partitions/hists
  plot_dir: evaluation_region_partitions/plots

