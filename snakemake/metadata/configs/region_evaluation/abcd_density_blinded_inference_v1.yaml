version: density_sndsw_scifi_blinded_inference_v1
description: >
  Reblinded-development Region V1 ABCD expected-sensitivity workflow. The
  expected path reads observed data only in B/C/D; signal-region A observations
  are neither an input nor a field in the sanitized table.

source:
  binning_version: density_sndsw_scifi_v1
  observable: density_scifi_sndsw
  roles:
    A: signal_no_veto_has_us_fiducial_inside
    B: sideband_no_veto_has_us_fiducial_outside
    C: sideband_has_veto_no_us_fiducial_inside
    D: sideband_has_veto_no_us_fiducial_outside
  signal_sample: CC_nue
  background_samples: [CC_numu, NC_nue, NC_numu]

model:
  signal_parameter: mu
  signal_initial: 1.0
  signal_bounds: [0.0, 100.0]
  signal_injection: 1.0
  nonclosure:
    nominal: 1.0
    constraint: none
    validation_status: UNVALIDATED
  background_mc_normalization:
    CC_numu: 0.30
    NC_nue: 0.30
    NC_numu: 0.30
  background_mc_uncertainty_status: PLACEHOLDER
  include_mc_statistical_uncertainty: false

fit:
  maxiter: 100000
  tolerance: 0.1
  mu_scan_range: [0.0, 10.0]
  mu_scan_points: 81

analyses:
  cutcount:
    title: Blinded high-density ABCD cut-and-count expected sensitivity
    role: primary high-density expected-sensitivity diagnostic
    bin_edges: [5000, 40000]
    output_directory: cutcount_v1
  shape:
    title: Blinded high-density ABCD two-bin expected sensitivity
    role: exploratory shape expected-sensitivity diagnostic
    bin_edges: [5000, 7000, 40000]
    output_directory: shape_v1

output:
  directory: evaluation_region_partitions/abcd/partition_v1_region_v1/density_sndsw_scifi_v1/blinded_inference_v1
  sanitized_inputs: sanitized_blinded_inputs.csv
  model_inputs: model_inputs.csv
  control_workspace: control_workspace.json
  expected_background_workspace: expected_background_workspace.json
  expected_signal_workspace: expected_signal_workspace.json
  expected_results: expected_results.json
  mu_scan: expected_mu_scan.csv
  report_markdown: expected_report.md
  report_tex: expected_report.tex
  report_pdf: expected_report.pdf
  plot_directory: plots
  freeze_manifest: freeze_manifest.json

blinding:
  status: REBLINDED_DEVELOPMENT
  signal_region_observation_allowed_in_expected_inputs: false
  observed_inference_authorized: false
  note: >
    Region A was inspected in earlier development. This workflow enforces
    technical masking from this point forward but cannot restore historical
    blindness.
