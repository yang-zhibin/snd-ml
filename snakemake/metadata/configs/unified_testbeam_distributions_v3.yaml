version: unified_testbeam_distributions_v3
description: Geometry-controlled and explicitly opted-in cross-geometry testbeam distributions.

tree_name: sndData
selection:
  name: scifi35
  expression: count_scifi > 35
  label: Selected SciFi hits > 35

testbeam_2023:
  manifest_version: unified_testbeam_2023_h8_v2
  target_events_per_cell: 50000
  selected_cells:
    - particle: pi+
      pdg_code: 211
      energies_gev: [100, 140, 180]
    - particle: pi-
      pdg_code: -211
      energies_gev: [300]

features:
  density_sndsw_scifi:
    expression: density_sndsw_scifi
    x_min: 0
    x_max: 40000
    bin_width: 250
    axis_title: SciFi density (SND getSumDensity)
    log_y: true
    fold_underflow_for_plot: false
    fold_overflow_for_plot: true
  scifi_cluster_qdc_per_hit:
    expression: scifi_cluster_qdc_per_hit
    x_min: 0
    x_max: 7
    bin_width: 0.1
    axis_title: All-cluster SciFi QDC / hit
    log_y: false
    fold_underflow_for_plot: false
    fold_overflow_for_plot: false
  scifi_qdc_per_hit_direct:
    expression: scifi_qdc_per_hit_direct
    x_min: 0
    x_max: 15
    bin_width: 0.2
    axis_title: Direct selected SciFi QDC / hit
    log_y: false
    fold_underflow_for_plot: false
    fold_overflow_for_plot: true
  scifi_vertical_cluster1_qdc_std:
    expression: scifi_vertical_cluster1_qdc_std
    feature_cut: scifi_vertical_cluster1_exists == 1
    x_min: 0
    x_max: 15
    bin_width: 0.2
    axis_title: Vertical leading-cluster QDC standard deviation
    log_y: false
    fold_underflow_for_plot: false
    fold_overflow_for_plot: true
  scifi_horizontal_cluster1_qdc_std:
    expression: scifi_horizontal_cluster1_qdc_std
    feature_cut: scifi_horizontal_cluster1_exists == 1
    x_min: 0
    x_max: 15
    bin_width: 0.2
    axis_title: Horizontal leading-cluster QDC standard deviation
    log_y: false
    fold_underflow_for_plot: false
    fold_overflow_for_plot: true

group_templates:
  mc_pion:
    family: testbeam_mc_2024
    geometry_setup_id: W_2walls_28plates
    source_pdg_code: 211
    max_events: 2520
    particle_charge: pi+
  mc_electron_scan:
    family: testbeam_mc_2024
    geometry_setup_id: W_2walls_28plates
    source_pdg_code: 11
    max_events: 2880
    particle_charge: e-
  mc_electron_compare:
    family: testbeam_mc_2024
    geometry_setup_id: W_2walls_28plates
    source_pdg_code: 11
    max_events: 2520
    particle_charge: e-
  data_electron:
    family: testbeam_data_2024
    geometry_setup_id: W_2walls_28plates
    source_pdg_code: 11
    max_events: 50000
    particle_charge: e-
    label_template: "Data e- {energy} GeV - W 2-wall, H4 2024"
  data_pion_2023:
    family: testbeam_data_2023_h8
    geometry_setup_id: Fe_3walls_H8_2023
    source_pdg_code: 211
    max_events: 50000
    particle_charge: pi+
    label_template: "Data pi+ {energy} GeV - Fe 3-wall, H8 2023"
  data_pion_2024:
    family: testbeam_data_2024
    geometry_setup_id: W_2walls_28plates
    source_pdg_code: 211
    max_events: 50000
    particle_charge: pi+

group_series:
  mc_pion_scan:
    template: mc_pion
    energies: [50, 100, 150, 180, 200, 250, 300]
  mc_electron_scan:
    template: mc_electron_scan
    energies: [50, 100, 150, 200, 250, 300]
  mc_electron_compare:
    template: mc_electron_compare
    energies: [50, 100, 150, 200, 250, 300]
  data_pion_scan:
    template: data_pion_2023
    energies: [100, 140, 180]
  data_electron_scan:
    template: data_electron
    energies: [50, 100, 150, 200, 250, 300]

groups:
  data_pion_w2_180:
    family: testbeam_data_2024
    geometry_setup_id: W_2walls_28plates
    source_filters: {source_pdg_code: 211, source_energy_gev: 180}
    expression: ""
    max_events: 50000
    sampling_policy: deterministic_chain_prefix_v1
    particle_charge: pi+
    beam_energy_gev: 180
    label: Data pi+ 180 GeV - W 2-wall, H4 2024
  data_pion_fe3_300_negative:
    family: testbeam_data_2023_h8
    geometry_setup_id: Fe_3walls_H8_2023
    source_filters: {source_pdg_code: -211, source_energy_gev: 300}
    expression: ""
    max_events: 50000
    sampling_policy: deterministic_chain_prefix_v1
    particle_charge: pi-
    beam_energy_gev: 300
    label: Data pi- 300 GeV - Fe 3-wall, H8 2023

plot_sets:
  mc_pion_energy_scan:
    geometry_policy: same_geometry
    groups: [mc_pion_scan_50, mc_pion_scan_100, mc_pion_scan_150, mc_pion_scan_180, mc_pion_scan_200, mc_pion_scan_250, mc_pion_scan_300]
  mc_electron_energy_scan:
    geometry_policy: same_geometry
    groups: [mc_electron_scan_50, mc_electron_scan_100, mc_electron_scan_150, mc_electron_scan_200, mc_electron_scan_250, mc_electron_scan_300]
  data_pion_positive_energy_scan:
    geometry_policy: same_geometry
    groups: [data_pion_scan_100, data_pion_scan_140, data_pion_scan_180]
  data_electron_energy_scan:
    geometry_policy: same_geometry
    groups: [data_electron_scan_50, data_electron_scan_100, data_electron_scan_150, data_electron_scan_200, data_electron_scan_250, data_electron_scan_300]
  mc_particle_50: {geometry_policy: same_geometry, groups: [mc_pion_scan_50, mc_electron_compare_50]}
  mc_particle_100: {geometry_policy: same_geometry, groups: [mc_pion_scan_100, mc_electron_compare_100]}
  mc_particle_150: {geometry_policy: same_geometry, groups: [mc_pion_scan_150, mc_electron_compare_150]}
  mc_particle_200: {geometry_policy: same_geometry, groups: [mc_pion_scan_200, mc_electron_compare_200]}
  mc_particle_250: {geometry_policy: same_geometry, groups: [mc_pion_scan_250, mc_electron_compare_250]}
  mc_particle_300: {geometry_policy: same_geometry, groups: [mc_pion_scan_300, mc_electron_compare_300]}
  mc_particle_mismatch_180pi_200e: {geometry_policy: same_geometry, groups: [mc_pion_scan_180, mc_electron_compare_200]}
  data_particle_mismatch_180pi_200e: {geometry_policy: same_geometry, groups: [data_pion_w2_180, data_electron_scan_200]}
  data_cross_geometry_100:
    geometry_policy: cross_geometry_diagnostic
    groups: [data_pion_scan_100, data_electron_scan_100]
  data_cross_geometry_140pi_150e:
    geometry_policy: cross_geometry_diagnostic
    groups: [data_pion_scan_140, data_electron_scan_150]
  data_cross_geometry_180pi_200e:
    geometry_policy: cross_geometry_diagnostic
    groups: [data_pion_scan_180, data_electron_scan_200]
  data_cross_geometry_300:
    geometry_policy: cross_geometry_diagnostic
    groups: [data_pion_fe3_300_negative, data_electron_scan_300]
  data_combined_particle_energy:
    geometry_policy: cross_geometry_diagnostic
    style_policy: paired_particle_energy
    legend_columns: 2
    legend_label_mode: configured
    draw_style: points_errors
    unit_area_mode: bin_fraction
    display_x_ranges:
      scifi_cluster_qdc_per_hit: [0, 8]
      scifi_qdc_per_hit_direct: [0, 7]
      scifi_vertical_cluster1_qdc_std: [0, 7]
      scifi_horizontal_cluster1_qdc_std: [0, 7]
    annotation_lines:
      - "Test-beam data - cross-geometry diagnostic"
      - "Pions: H8 2023, Fe target, 3 walls; electrons: H4 2024, W target, 2 walls, 28 plates"
      - "Selection: SciFi hits > 35; normalization: bin fractions sum to 1"
    groups:
      - data_pion_scan_100
      - data_electron_scan_100
      - data_pion_scan_140
      - data_electron_scan_150
      - data_pion_scan_180
      - data_electron_scan_200
      - data_pion_fe3_300_negative
      - data_electron_scan_300
  mc_combined_particle_energy:
    geometry_policy: same_geometry
    style_policy: paired_particle_energy
    legend_columns: 2
    legend_label_mode: compact_particle_energy
    draw_style: points_errors
    unit_area_mode: bin_fraction
    display_x_ranges:
      scifi_cluster_qdc_per_hit: [0, 8]
      scifi_qdc_per_hit_direct: [0, 7]
      scifi_vertical_cluster1_qdc_std: [0, 7]
      scifi_horizontal_cluster1_qdc_std: [0, 7]
    annotation_lines:
      - "MC test beam 2024 - W target, 2 walls, 28 plates"
      - "Selection: SciFi hits > 35; normalization: bin fractions sum to 1"
    groups:
      - mc_pion_scan_50
      - mc_electron_compare_50
      - mc_pion_scan_100
      - mc_electron_compare_100
      - mc_pion_scan_150
      - mc_electron_compare_150
      - mc_pion_scan_200
      - mc_electron_compare_200
      - mc_pion_scan_250
      - mc_electron_compare_250
      - mc_pion_scan_300
      - mc_electron_compare_300

normalizations:
  unit_area:
    y_axis_title: Probability density

source_manifests:
  testbeam_mc_2024: /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/manifests/testbeam_mc_2024.csv
  testbeam_data_2024: /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/manifests/testbeam_data_2024.csv
  testbeam_data_2023_h8: /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/testbeam_2023_h8_v2/testbeam_data_2023_h8.csv

shard_receipt_roots:
  testbeam_data_2024: /eos/experiment/sndlhc/users/zhibin/snd-ml/unified_shower_features_v1/shards/testbeam_data_2024

inputs:
  testbeam_data_2023_metadata: /afs/cern.ch/work/z/zhibin/snd-ml/testbeam/metadata/updated/real_data_testbeam_June2023_H8_metadata.csv

outputs:
  metadata_root: /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/metadata/testbeam_distributions_v3
  selection_root: /eos/experiment/sndlhc/users/zhibin/snd-ml/unified_shower_features_v1/selection_indices/testbeam_data_2023_h8
  feature_root_2023: /eos/experiment/sndlhc/users/zhibin/snd-ml/unified_shower_features_v1/features/testbeam_data_2023_h8
  histogram_root: /eos/experiment/sndlhc/users/zhibin/snd-ml/unified_shower_features_v1/histograms/testbeam_distributions
  plot_root: /afs/cern.ch/work/z/zhibin/snd-ml-outputs/unified_shower_features_v1/plots/testbeam_distributions
