model_version: CNN3D_v1

data:
  batch_size: 16
  num_workers: 4
  drop_missing_energy: true
  target_transform: log1p

voxel:
  voxel_size: [1.0, 1.0, 1.0]
  feature_channels: [qdc_sum, occupancy, dettype_1, dettype_2, dettype_3]
  x_range: null
  y_range: null
  z_range: null
  clamp_out_of_bounds: false

model:
  in_channels: 5
  base_channels: 16
  dropout: 0.1
  output_dim: 1
  backend: minkowski

optim:
  lr: 0.0003
  weight_decay: 0.0001
  loss: huber
  huber_delta: 1.0
  scheduler: reduce_on_plateau
  scheduler_monitor: val_mae
  scheduler_mode: min
  scheduler_factor: 0.5
  scheduler_patience: 2
  scheduler_min_lr: 1.0e-6

trainer:
  max_epochs: 20
  accelerator: cpu
  devices: 1
  log_every_n_steps: 10

wandb:
  project: snd-ml-train-3d
  entity: null
  offline: false
  save_dir: /afs/cern.ch/work/z/zhibin/snd-ml/train_3d/wandb_logs

checkpoint:
  monitor: val_mae
  mode: min
  save_top_k: 1

early_stopping:
  monitor: val_mae
  mode: min
  patience: 5
  min_delta: 0.0

evaluation:
  relative_eps: 1.0e-6
  n_energy_bins: 10
  min_bin_count: 10

runtime:
  seed: 42
